  <text x="36" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="35" font-weight="700" letter-spacing="-0.6" fill="#E6EDF3">Jiahao Li <tspan fill="#10B981" font-weight="400">//</tspan></text>
  <text x="36" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#2DD4BF">Memory &amp; Native Long-Horizon Training in WAMs</text>
  <text x="36" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8B949E">Generative Foundations: Flow Matching · Diffusion Models · Latent VAEs</text>

