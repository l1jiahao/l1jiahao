<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 225" width="920" height="225" role="img" aria-label="Jiahao Li — Embodied Intelligence and Generative Modeling">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#0F171F"/>
    </linearGradient>
    <radialGradient id="glowDark" cx="82%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#2DD4BF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trajDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <pattern id="gridDark" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1E2B36" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Base Frame -->
  <rect x="1" y="1" width="918" height="223" rx="12" fill="url(#bgDark)" stroke="#213438" stroke-width="1.2"/>
