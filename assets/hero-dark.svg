  <text x="97" y="189" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.5" fill="#E6EDF3">WAM · MEMORY</text>

  <rect x="168" y="172" width="206" height="26" rx="6" fill="#131C24" stroke="#213438" stroke-width="1"/>
