  <rect x="1" y="1" width="918" height="223" rx="12" fill="url(#glowDark)"/>

  <!-- Corner Registration Marks -->
  <path d="M 12 22 L 12 12 L 22 12 M 898 12 L 908 12 L 908 22 M 12 203 L 12 213 L 22 213 M 898 213 L 908 213 L 908 203" fill="none" stroke="#2DD4BF" stroke-width="1.2" opacity="0.45"/>

  <!-- Top Telemetry Bar -->
  <circle cx="38" cy="27" r="7" fill="#10B981" opacity="0.22"/>
  <circle cx="38" cy="27" r="3.5" fill="#10B981"/>
  <text x="53" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.1" fill="#10B981">ACTIVE RESEARCH // EMBODIED INTELLIGENCE</text>
  <text x="884" y="31" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" letter-spacing="0.9" fill="#8B949E">SHANGHAI · ICLR '26 FIRST AUTHOR</text>
  <line x1="34" y1="45" x2="886" y2="45" stroke="#1E2B36" stroke-width="1"/>

