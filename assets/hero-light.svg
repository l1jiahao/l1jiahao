  <path d="M 638 144 C 662 144, 669 114, 693 114 S 724 136, 748 136 S 779 113, 803 113 S 830 102, 854 102" fill="none" stroke="url(#trajLight)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- State Nodes -->
  <circle cx="638" cy="144" r="4.2" fill="#1B6B58" opacity="0.55"/>
  <circle cx="693" cy="114" r="4.2" fill="#1B6B58" opacity="0.7"/>
  <circle cx="748" cy="136" r="4.2" fill="#1B6B58" opacity="0.85"/>
  <circle cx="803" cy="113" r="4.2" fill="#0D9488" opacity="0.95"/>
  <circle cx="854" cy="102" r="16" fill="none" stroke="#0D9488" stroke-width="1" opacity="0.22"/>
  <circle cx="854" cy="102" r="10" fill="#0D9488" opacity="0.18"/>
  <circle cx="854" cy="102" r="5" fill="#0D9488"/>

  <!-- Step Labels & Caption -->
  <text x="638" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#4F635E">t₀</text>
  <text x="693" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#4F635E">t₁</text>
  <text x="748" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#4F635E">t₂</text>
  <text x="803" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#4F635E">t₃</text>
  <text x="854" y="174" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="700" fill="#0D9488">t_H</text>

  <text x="744.5" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" letter-spacing="1.1" fill="#4F635E">LONG-HORIZON MEMORY ROLLOUT</text>
