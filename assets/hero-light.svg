<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 225" width="920" height="225" role="img" aria-label="Jiahao Li — Embodied Intelligence and Generative Modeling">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAF9"/>
      <stop offset="100%" stop-color="#EFF5F2"/>
    </linearGradient>
    <radialGradient id="glowLight" cx="82%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#1B6B58" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#0D9488" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#F8FAF9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trajLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B6B58" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#1B6B58"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <pattern id="gridLight" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#DCE6E1" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Base Frame -->
  <rect x="1" y="1" width="918" height="223" rx="12" fill="url(#bgLight)" stroke="#C9DBD3" stroke-width="1.2"/>
  <rect x="1" y="1" width="918" height="223" rx="12" fill="url(#gridLight)" opacity="0.85"/>
  <rect x="1" y="1" width="918" height="223" rx="12" fill="url(#glowLight)"/>

  <!-- Corner Registration Marks -->
  <path d="M 12 22 L 12 12 L 22 12 M 898 12 L 908 12 L 908 22 M 12 203 L 12 213 L 22 213 M 898 213 L 908 213 L 908 203" fill="none" stroke="#1B6B58" stroke-width="1.2" opacity="0.45"/>

  <!-- Top Telemetry Bar -->
  <circle cx="38" cy="27" r="7" fill="#1B6B58" opacity="0.18"/>
  <circle cx="38" cy="27" r="3.5" fill="#1B6B58"/>
  <text x="53" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.1" fill="#1B6B58">ACTIVE RESEARCH // EMBODIED INTELLIGENCE</text>
  <text x="884" y="31" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" letter-spacing="0.9" fill="#4F635E">SHANGHAI · ICLR '26 FIRST AUTHOR</text>
  <line x1="34" y1="45" x2="886" y2="45" stroke="#DCE6E1" stroke-width="1"/>

