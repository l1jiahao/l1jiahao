  <text x="869" y="77" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="600" fill="#0D9488">t₀ → t_H</text>

  <!-- Plot Reference Lines -->
  <line x1="622" y1="100" x2="867" y2="100" stroke="#E5EEEA" stroke-width="1"/>
  <line x1="622" y1="125" x2="867" y2="125" stroke="#E5EEEA" stroke-width="1"/>
  <line x1="622" y1="150" x2="867" y2="150" stroke="#E5EEEA" stroke-width="1"/>

