  <text x="36" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="35" font-weight="700" letter-spacing="-0.6" fill="#152421">Jiahao Li <tspan fill="#1B6B58" font-weight="400">//</tspan></text>
  <text x="36" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#0D9488">Memory &amp; Native Long-Horizon Training in WAMs</text>
  <text x="36" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#4F635E">Generative Foundations: Flow Matching · Diffusion Models · Latent VAEs</text>

