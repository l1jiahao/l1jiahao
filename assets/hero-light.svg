  <rect x="36" y="172" width="122" height="26" rx="6" fill="#FFFFFF" stroke="#C9DBD3" stroke-width="1"/>
  <text x="97" y="189" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.5" fill="#152421">WAM · MEMORY</text>

  <rect x="168" y="172" width="206" height="26" rx="6" fill="#FFFFFF" stroke="#C9DBD3" stroke-width="1"/>
  <text x="271" y="189" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="0.5" fill="#0D9488">FLOW MATCHING · DIFFUSION</text>

  <rect x="384" y="172" width="160" height="26" rx="6" fill="#FFFFFF" stroke="#C9DBD3" stroke-width="1"/>
