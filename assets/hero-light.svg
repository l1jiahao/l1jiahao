  <path d="M 638 144 Q 746 167, 854 102" fill="none" stroke="#0D9488" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.65"/>
  <path d="M 693 114 Q 774 84, 854 102" fill="none" stroke="#1B6B58" stroke-width="1.3" stroke-dasharray="3 3" opacity="0.55"/>

